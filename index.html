<style>
:root {
  --cream: #f8f3e9;
  --paper: #fffdf7;
  --blue: #355c7d;
  --red: #b85c60;
  --gold: #c6a56b;
  --ink: #34332f;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg,#e9e4dc,#d5d9d8);
  font-family: 'Montserrat', sans-serif;
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 25px 12px;
}

header {
  text-align: center;
  margin-bottom: 22px;
}

header h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(23px,4vw,36px);
  color: var(--blue);
  margin: 0 0 7px;
}

header p {
  color: #68645e;
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.flag {
  display: flex;
  width: 65px;
  height: 39px;
  margin: 12px auto;
  border: 1px solid #ddd;
  box-shadow: 0 2px 5px #0002;
}

.flag span {
  width: 50%;
  height: 100%;
}

.flag .left {
  background: linear-gradient(to bottom,#002d62 0 50%,#fff 50% 100%);
}

.flag .right {
  background: linear-gradient(to bottom,#ce1126 0 50%,#fff 50% 100%);
}

.book-area {
  width: 100%;
  max-width: 1000px;
  height: 82vh;
  height: 82dvh;
  display: flex;
  justify-content: center;
  align-items: center;
}

#book {
  width: 100%;
  height: 100%;
  margin: auto;
}

.page {
  background: var(--paper);
  padding: 35px 38px 30px;
  overflow: hidden;
  border: 1px solid #e8dfd0;
}

.page-content {
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}

.page-number {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  border-top: 1px solid #e8dfd0;
  padding-top: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #9b9181;
  font-size: 9px;
  letter-spacing: 1px;
}

.page-number::after {
  content: "";
  width: 35px;
  height: 8px;
  background: linear-gradient(90deg,#355c7d 50%,#b85c60 50%);
  opacity: .65;
}

.eyebrow {
  color: var(--red);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 9px;
}

h2 {
  font-family: 'Playfair Display', serif;
  color: var(--blue);
  font-size: 27px;
  line-height: 1.15;
  margin: 0 0 9px;
}

.subtitle {
  color: #82786c;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 17px;
}

.cover {
  background:
    radial-gradient(circle at center,#ffffff 0,#f8f1e5 70%);
  text-align: center;
  justify-content: center;
  align-items: center;
  border: 8px double #d5bd91;
  padding: 35px;
}

.cover h2 {
  font-size: 39px;
  line-height: 1.2;
  margin: 20px 0;
}

.cover .subtitle {
  max-width: 260px;
  line-height: 1.8;
}

.cover-decoration {
  width: 80px;
  height: 3px;
  background: linear-gradient(90deg,var(--blue) 50%,var(--red) 50%);
  margin: 15px auto;
}

.cover-small {
  font-size: 10px;
  color: #817665;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.bio-layout {
  display: grid;
  grid-template-columns: 34% 1fr;
  gap: 18px;
  align-items: start;
}

.portrait {
  width: 100%;
  height: 350px;
  object-fit: cover;
  object-position: center top;
  border: 5px solid white;
  box-shadow: 0 3px 13px #0002;
  background: #eee6d9;
}

.portrait-caption {
  font-size: 9px;
  color: #8b8173;
  text-align: center;
  margin-top: 7px;
  line-height: 1.5;
}

.bio-copy {
  min-width: 0;
}

.bio-copy h3 {
  font-family: 'Playfair Display', serif;
  color: var(--red);
  font-size: 14px;
  margin: 0 0 5px;
}

.bio-copy p {
  font-family: 'Playfair Display', serif;
  font-size: 11.5px;
  line-height: 1.55;
  text-align: justify;
  color: #48443e;
  margin: 0 0 10px;
}

.bio-copy .highlight {
  background: #f4eee3;
  border-left: 3px solid var(--gold);
  padding: 9px 11px;
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 11px;
  line-height: 1.5;
  margin-top: 8px;
}

.divider-page {
  background: linear-gradient(145deg,#f7f0e4,#e9edf0);
  justify-content: center;
  text-align: center;
  align-items: center;
}

.divider-page h2 {
  font-size: 34px;
}

.divider-page p {
  max-width: 270px;
  font-family: 'Playfair Display', serif;
  line-height: 1.8;
  color: #716b61;
  font-size: 14px;
}

.intro-text {
  font-family: 'Playfair Display', serif;
  font-size: 14px;
  line-height: 1.9;
  text-align: justify;
  color: #514c44;
}

.control-panel {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
  margin-top: 22px;
}

button {
  border: none;
  background: var(--blue);
  color: white;
  padding: 11px 19px;
  border-radius: 30px;
  cursor: pointer;
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  transition: .2s;
}

button:hover {
  background: var(--red);
  transform: translateY(-2px);
}

#page-indicator {
  color: #625e57;
  font-size: 11px;
  min-width: 85px;
  text-align: center;
}

@media (max-width: 600px) {
  body {
    padding: 15px 8px;
  }

  header {
    margin-bottom: 12px;
  }

  header h1 {
    font-size: 25px;
  }

  .book-area {
    width: 100%;
    height: min(78vh, 650px);
    min-height: 420px;
  }

  .page {
    padding: 20px 16px 26px;
  }

  .bio-layout {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .portrait {
    width: 120px;
    height: 145px;
    display: block;
    margin: auto;
  }

  .bio-copy p {
    font-size: 10px;
    line-height: 1.4;
  }

  .bio-copy h3 {
    font-size: 12px;
  }

  .bio-copy .highlight {
    font-size: 10px;
  }

  h2 {
    font-size: 22px;
  }

  .cover h2 {
    font-size: 29px;
  }

  .intro-text {
    font-size: 12px;
    line-height: 1.6;
  }
}
</style>
</head>

const book = document.getElementById("book");
let pageFlip;

function pageNumber(number) {
  return `<div class="page-number"><span>HISTORIA DOMINICANA</span><span>${number}</span></div>`;
}

function addPage(content, className="") {
  const page = document.createElement("div");
  page.className = "page";
  page.innerHTML = `<div class="page-content ${className}">${content}</div>`;
  book.appendChild(page);
}

addPage(`
  <div class="cover-small">Una mirada a nuestra historia</div>
  <div class="flag"><span class="left"></span><span class="right"></span></div>
  <div class="cover-decoration"></div>
  <h2>Líderes de la<br>República Dominicana</h2>
  <div class="cover-decoration"></div>
  <p class="subtitle">Personajes que marcaron nuestra historia política, social, cultural y deportiva</p>
  <p class="cover-small">Edición histórica</p>
`, "cover");

addPage(`
  <div class="eyebrow">Presentación</div>
  <h2>Conocer nuestro pasado para comprender el presente</h2>
  <p class="intro-text">
  La historia de la República Dominicana ha sido construida por personas que, desde diferentes espacios, han influido en el desarrollo del país. Algunos participaron en la lucha por la independencia y la defensa de la soberanía; otros transformaron la educación, la política, la cultura, el deporte y la vida social.
  </p>
  <p class="intro-text">
  Este libro reúne perfiles de líderes dominicanos y figuras vinculadas a nuestra historia. Cada biografía presenta aspectos de su vida, trayectoria, aportes y legado, con el propósito de comprender el contexto en el que actuaron y la influencia que tuvieron en la sociedad.
  </p>
  <p class="intro-text">
  El liderazgo no se expresa de una sola manera. Puede manifestarse mediante decisiones políticas, acciones de resistencia, enseñanza, creación artística, servicio público o representación deportiva. Por eso, las personas incluidas en estas páginas reflejan distintas formas de contribuir al país.
  </p>
  ${pageNumber(2)}
`);

addPage(`
  <div class="eyebrow">Contenido</div>
  <h2>Personajes incluidos</h2>
  <p class="intro-text">
  <b>Independencia y soberanía:</b> Juan Pablo Duarte, Francisco del Rosario Sánchez y Ramón Matías Mella.<br><br>
  <b>Historia política:</b> Gregorio Luperón, Ulises Heureaux, Rafael Leónidas Trujillo, Juan Bosch, Joaquín Balaguer, José Francisco Peña Gómez, Francisco Alberto Caamaño, Luis Abinader, Raquel Peña, José Ignacio Paliza, Leonel Fernández, Danilo Medina, Abel Martínez y Omar Fernández.<br><br>
  <b>Resistencia y derechos:</b> Hermanas Mirabal y Mamá Tingó.<br><br>
  <b>Educación y cultura:</b> Eugenio María de Hostos, Salomé Ureña, Pedro Mir y Juan Luis Guerra.<br><br>
  <b>Deporte:</b> Marileidy Paulino y David Ortiz.
  </p>
  ${pageNumber(3)}
`);

leaders.forEach((person, index) => {
  addPage(`
    <div class="eyebrow">Biografía ${String(index+1).padStart(2,"0")}</div>
    <h2>${person.name}</h2>
    <div class="subtitle">${person.years} · ${person.role}</div>
    <div class="bio-layout">
      <div>
        <img class="portrait" src="${person.image}" alt="Retrato de ${person.name}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div style="display:none; height:170px; background:#eee6d9; color:#355c7d; align-items:center; justify-content:center; font-family:'Playfair Display'; font-size:28px;">
          ${person.name.split(" ").map(x=>x[0]).join("").slice(0,3)}
        </div>
        <div class="portrait-caption">${person.name}<br>${person.role}</div>
      </div>
      <div class="bio-copy">
        <h3>Vida y formación</h3>
        <p>${person.life}</p>
        <h3>Trayectoria</h3>
        <p>${person.trajectory}</p>
        <h3>Aportes e influencia</h3>
        <p>${person.contributions}</p>
        <h3>Legado</h3>
        <p>${person.legacy}</p>
        <div class="highlight">Su historia forma parte de la memoria colectiva y permite conocer distintas expresiones del liderazgo dominicano.</div>
      </div>
    </div>
    ${pageNumber(index+4)}
  `);
});

addPage(`
  <div class="eyebrow">Reflexión final</div>
  <h2>El liderazgo como parte de nuestra identidad</h2>
  <p class="intro-text">
  Las figuras presentadas en este libro muestran que la historia dominicana ha sido construida mediante esfuerzos, decisiones y luchas muy diferentes. La independencia, la defensa de los derechos, la educación, la cultura y el deporte han sido espacios en los que distintas personas han dejado una huella.
  </p>
  <p class="intro-text">
  Conocer sus trayectorias permite reconocer los avances alcanzados, pero también reflexionar sobre los conflictos, errores y desafíos que han marcado nuestra historia. No todos los personajes tuvieron el mismo impacto ni representan los mismos valores; estudiarlos con sentido crítico ayuda a comprender mejor el pasado.
  </p>
  <p class="intro-text">
  El legado de un líder no debe medirse solamente por el poder que alcanzó, sino también por las consecuencias de sus decisiones y por la manera en que influyó en la vida de otras personas.
  </p>
  ${pageNumber(leaders.length+4)}
`);

addPage(`
  <div class="eyebrow">Cierre</div>
  <h2>La historia continúa</h2>
  <div class="cover-decoration"></div>
  <p class="intro-text" style="text-align:center">
  Cada generación tiene la responsabilidad de conocer, cuidar y construir la historia de la República Dominicana.
  </p>
  <div class="flag"><span class="left"></span><span class="right"></span></div>
  <p class="cover-small" style="text-align:center">República Dominicana</p>
`);

pageFlip = new St.PageFlip(book, {
  width: 480,
  height: 650,
  size: "stretch",
  minWidth: 200,
  maxWidth: 650,
  minHeight: 260,
  maxHeight: 850,
  maxShadowOpacity: 0.35,
  showCover: true,
  mobileScrollSupport: true,
  flippingTime: 900,
  usePortrait: true,
  startPage: 0,
  autoSize: false
});

pageFlip.loadFromHTML(document.querySelectorAll("#book .page"));

  const resizeObserver = new ResizeObserver(() => {
  pageFlip.update();
});

resizeObserver.observe(document.querySelector(".book-area"));

function nextPage() {
  pageFlip.flipNext();
}

function previousPage() {
  pageFlip.flipPrev();
}

pageFlip.on("flip", (event) => {
  document.getElementById("page-indicator").textContent =
    `Página ${event.data + 1} de ${pageFlip.getPageCount()}`;
});

document.addEventListener("keydown", event => {
  if (event.key === "ArrowRight") nextPage();
  if (event.key === "ArrowLeft") previousPage();
});

</script>
</body>
